[project]
name = "popote-api"
version = "0.3.0"
description = "Stock, recettes et courses du foyer, exposés en API HTTP et en serveur MCP"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.165.0",
    "mcp>=2.3.0",
    "openai>=3.57.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "sqlmodel>=0.0.50",
]

[dependency-groups]
dev = [
    "faker>=40.63.0",
    "httpx>=0.28.1",
    "prek>=0.5.11",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]

# ===============
# pytest
# ===============

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["-v", "--timeout=30"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ===============
# ruff
# ===============

[tool.ruff]
exclude = [".git", ".venv", ".pytest_cache", ".ruff_cache", "build", "dist", "data", "node_modules"]
line-length = 120
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "N",
    "S",
    "TRY",
    "T20",
    "SLF",
    "SIM",
    "PTH",
    "FLY",
    "LOG",
    "ARG",
    "PERF",
    "DTZ",
    "UP",
    "I",
]
ignore = ["N818", "PTH123", "TRY003", "S311", "S104"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF", "S101", "ARG"]
"src/adapters/driven/recipe_generators/_unavailable.py" = ["ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
